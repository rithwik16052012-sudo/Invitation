<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OH YEAH! You are invited!</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: black;
      color: #fff;
      text-align: center;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 100%;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      transition: left 1s ease-in-out, opacity 1s ease-in-out;
      opacity: 0;
    }

    .active {
      left: 0;
      opacity: 1;
    }

    .animated-text {
      font-size: 2em;
      text-transform: uppercase;
      animation: pulse 1.5s infinite alternate, fadeInSlide 1s ease forwards, colorShift 3s infinite alternate;
    }
    .rgb-button {
  margin-top: 20px;
  padding: 12px 28px;
  font-size: 1.3em;
  font-weight: bold;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  color: #fff;
  background: linear-gradient(270deg, red, orange, yellow, green, blue, indigo, violet);
  background-size: 1400% 1400%;
  animation: rgbShift 8s ease infinite;
  transition: transform 0.2s ease;
}

.rgb-button:hover {
  transform: scale(1.1);
}

@keyframes rgbShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}


    /* Pulsating effect */
    @keyframes pulse {
      from {
        transform: scale(1);
        opacity: 0.8;
      }
      to {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    /* Words slide in + fade */
    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Smooth color shifting */
    @keyframes colorShift {
      0% { color: #ff3366; }
      25% { color: #ffcc33; }
      50% { color: #33ffcc; }
      75% { color: #3399ff; }
      100% { color: #cc33ff; }
    }

    .poster-space {
      width: 80%;
      height: 60%;
      border: 3px dashed #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2em;
      color: #fff;
      animation: fadeInSlide 1s ease forwards;
    }

    .venue {
      position: absolute;
      bottom: 20px;
      font-size: 1em;
      color: #fff;
      opacity: 0.9;
      animation: fadeInSlide 1s ease forwards, colorShift 3s infinite alternate;
    }
  </style>
</head>
<body>
  <!-- Screen 1 -->
  <div class="screen active" id="screen1">
    <div class="animated-text">OH YEAH! You are invited!</div>
    <button class="rgb-button" id="letsGoBtn">LET'S GO</button>
  </div>

  <!-- Screen 2 -->
  <div class="screen" id="screen2">
   <img src="WhatsApp Image 2026-08-27 at 3.50.48 PM.jpeg" alt="Description of the image" width="400" height="400">
    <button class="rgb-button" id="letsGoBtn">Click here to go next</button>
  </div>

  <!-- Screen 3 -->
  <div class="screen" id="screen3">
    <div class="animated-text">Join us for fun filled games and activities!</div>
    <div class="venue">Ashiana Town Bhiwadi Club, Multipurpose Hall (Badminton Court)</div>
  </div>

  <script>
    let current = 0;
    const screens = document.querySelectorAll('.screen');

    // Move to next screen when user clicks/taps anywhere
    document.body.addEventListener('click', () => {
      screens[current].classList.remove('active');
      current = (current + 1) % screens.length;
      screens[current].classList.add('active');
    });
  </script>
</body>
</html>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</body>
</html>
